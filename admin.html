<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GN Digital Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Iskoola+Pota&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Iskoola Pota', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Login Modal / Screen -->
    <div id="loginModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">🔒 Admin Login</h2>
            <p class="text-sm text-gray-600 mb-4">කරුණාකර පද්ධතියට පිවිසීමට මුරපදය ඇතුළත් කරන්න.</p>
            <input type="password" id="adminPassword" placeholder="මුරපදය (Password)" class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="checkLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold transition">පිවිසෙන්න (Login)</button>
            <p id="loginError" class="text-red-500 text-sm mt-2 hidden">වැරදි මුරපදයක්! කරුණාකර නැවත උත්සාහ කරන්න.</p>
        </div>
    </div>

    <!-- Main Dashboard Content -->
    <div id="dashboardContent" class="hidden">
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <a href="index.html" class="text-blue-600 hover:underline text-sm font-semibold">← වෙබ් අඩවියට යන්න</a>
                    <h1 class="text-xl font-bold text-gray-800">📊 Admin Dashboard</h1>
                </div>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 transition">🚪 ඉවත් වන්න (Logout)</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6">
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="px-6 py-4 bg-blue-900 text-white font-bold flex justify-between items-center">
                    <span>පාරිභෝගික විමසීම් සහ ඇණවුම් ලැයිස්තුව</span>
                    <button onclick="clearInquiries()" class="bg-red-600 text-xs px-3 py-1 rounded hover:bg-red-700 transition">සියල්ල මකන්න</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">දිනය / වේලාව</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">නම</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">දුරකථන අංකය</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">පණිවිඩය / පැකේජය</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">ක්‍රියාමාර්ග (Actions)</th>
                            </tr>
                        </thead>
                        <tbody id="inquiriesTableBody" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="px-6 py-4 text-center text-gray-500 text-sm">තවම විමසීම් ලැබී නැත.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Password Protection Logic
        const CORRECT_PASSWORD = "admin123"; // ඔබට අවශ්‍ය නම් මෙම මුරපදය වෙනස් කරගත හැක

        function checkLogin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === CORRECT_PASSWORD) {
                localStorage.setItem('isAdminLoggedIn', 'true');
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('dashboardContent').classList.remove('hidden');
                loadInquiries();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        // Check if already logged in during this session
        window.onload = function() {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('dashboardContent').classList.remove('hidden');
                loadInquiries();
            }
        };

        // Load Inquiries function
        function loadInquiries() {
            const inquiries = JSON.parse(localStorage.getItem('customerInquiries')) || [];
            const tbody = document.getElementById('inquiriesTableBody');
            
            if (inquiries.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500 text-sm">තවම විමසීම් ලැබී නැත.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            inquiries.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-right">${item.date}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 text-right">${item.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-right">${item.phone}</td>
                    <td class="px-6 py-4 text-sm text-gray-500 text-right">${item.message}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                        <a href="https://api.whatsapp.com/send?phone=94710912960&text=Hi%20${encodeURIComponent(item.name)},%20We%20received%20your%20inquiry%20regarding%20GN%20Digital%20Systems." target="_blank" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 transition inline-block text-xs">💬 WhatsApp Reply</a>
                        <button onclick="deleteInquiry(${index})" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition text-xs ml-2">මකන්න</button>
                    </td>
                `;
                tbody.appendChild(label = tr);
            });
        }

        function deleteInquiry(index) {
            let inquiries = JSON.parse(localStorage.getItem('customerInquiries')) || [];
            inquiries.splice(index, 1);
            localStorage.setItem('customerInquiries', JSON.stringify(inquiries));
            loadInquiries();
        }

        function clearInquiries() {
            if (confirm('ඔබට සියලුම විමසීම් ඉවත් කිරීමට අවශ්‍ය බව විශ්වාසද?')) {
                localStorage.removeItem('customerInquiries');
                loadInquiries();
            }
        }
    </script>
</body>
</html>
